main:
  params: [args]
  steps:
    - scrape_flights:
        call: http.post
        args:
          url: ${function_uri}
          body: $${args}
          auth:
            type: OIDC
        result: scrape_result

    - compile_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${project_id}/locations/${region}/repositories/${dataform_repo_name}/compilationResults
          auth:
            type: OAuth2
          body:
            gitCommitish: "flight-tracker"
            codeCompilationConfig:
              vars:
                trip_type: $${default(map.get(args, "trip_type"), "")}
        result: compilation_result

    - invoke_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${project_id}/locations/${region}/repositories/${dataform_repo_name}/workflowInvocations
          auth:
            type: OAuth2
          body:
            compilationResult: $${compilation_result.body.name}
            invocationConfig:
              serviceAccount: "${dataform_runner_sa_email}"
        result: invocation_result

    - return_result:
        return:
          scraper_response: $${scrape_result.body}
          dataform_invocation: $${invocation_result.body.name}
