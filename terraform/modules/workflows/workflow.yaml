main:
  params: [args]
  steps:
    - init_vars:
        assign:
          - empty_map: {}
          - input_payload: '$${default(args, empty_map)}'
          - search_name: '$${default(map.get(input_payload, "search_name"), "default")}'
          - origin: '$${default(map.get(input_payload, "origin"), "BRU")}'
          - destination: '$${default(map.get(input_payload, "destination"), "YUL")}'
          - start_date: '$${default(map.get(input_payload, "start_date"), "2027-06-01")}'
          - trip_length: '$${default(map.get(input_payload, "trip_length"), 24)}'
          - flexibility_window: '$${default(map.get(input_payload, "flexibility_window"), 1)}'
          - trip_type: '$${default(map.get(input_payload, "trip_type"), "")}'
          - target_price: '$${map.get(input_payload, "target_price")}'
          - full_refresh: '$${default(map.get(input_payload, "full_refresh"), false)}'
          - price_alert_triggered: false

    - log_scrape_start:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: '$${"Starting flight scrape for " + string(search_name) + " (" + string(origin) + " -> " + string(destination) + ")"}'
            event_type: "FLIGHT_SCRAPE_STARTED"
            search_name: $${search_name}
            origin: $${origin}
            destination: $${destination}
            start_date: $${start_date}
            trip_length: $${trip_length}
            flexibility_window: $${flexibility_window}
            trip_type: $${trip_type}

    - scrape_flights:
        try:
          call: http.post
          args:
            url: ${function_uri}
            body: $${input_payload}
            timeout: 310
            auth:
              type: OIDC
          result: scrape_result
        retry:
          predicate: $${should_retry_scrape}
          max_retries: 3
          backoff:
            initial_delay: 5
            max_delay: 30
            multiplier: 2
        except:
          as: e
          steps:
            - log_scrape_failed:
                call: sys.log
                args:
                  severity: "ERROR"
                  json:
                    message: '$${"Flight scrape failed after retries for " + string(search_name) + ": " + default(map.get(e, "message"), "unknown error")}'
                    event_type: "FLIGHT_SCRAPE_FAILED"
                    search_name: $${search_name}
                    origin: $${origin}
                    destination: $${destination}
                    error_code: '$${map.get(e, "code")}'
                    error_tags: '$${default(map.get(e, "tags"), [])}'
                    error_body: '$${map.get(e, "body")}'
            - rethrow_scrape_error:
                raise: $${e}

    - log_scrape_complete:
        call: sys.log
        args:
          severity: "INFO"
          json:
            message: '$${"Flight scrape completed successfully for " + string(search_name)}'
            event_type: "FLIGHT_SCRAPE_COMPLETED"
            search_name: $${search_name}
            origin: $${origin}
            destination: $${destination}
            records_count: '$${map.get(scrape_result.body, "records_count")}'
            gcs_uri: '$${map.get(scrape_result.body, "gcs_uri")}'

    - compile_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${project_id}/locations/${region}/repositories/${dataform_repo_name}/compilationResults
          auth:
            type: OAuth2
          body:
            gitCommitish: "main"
        result: compilation_result

    - run_dataform:
        try:
          call: execute_dataform_invocation
          args:
            compilation_result_name: $${compilation_result.body.name}
            full_refresh: $${full_refresh}
          result: invocation_result
        retry:
          predicate: $${should_retry_dataform}
          max_retries: 3
          backoff:
            initial_delay: 10
            max_delay: 60
            multiplier: 2

    - query_price_alerts:
        call: http.post
        args:
          url: https://bigquery.googleapis.com/bigquery/v2/projects/${project_id}/queries
          auth:
            type: OAuth2
          body:
            useLegacySql: false
            query: |
              SELECT
                search_name,
                alert_reason,
                origin_airport,
                destination_airport,
                CAST(outbound_date AS STRING) AS outbound_date,
                COALESCE(CAST(return_date AS STRING), 'N/A') AS return_date,
                airlines,
                COALESCE(CAST(outbound_departure_time AS STRING), 'N/A') AS outbound_departure_time,
                COALESCE(CAST(outbound_duration_mins AS STRING), 'N/A') AS outbound_duration_mins,
                COALESCE(CAST(return_departure_time AS STRING), 'N/A') AS return_departure_time,
                COALESCE(CAST(return_duration_mins AS STRING), 'N/A') AS return_duration_mins,
                trip_type,
                CAST(current_price AS STRING) AS current_price,
                currency,
                COALESCE(CAST(prev_min_price AS STRING), 'N/A') AS prev_min_price,
                COALESCE(CAST(target_price AS STRING), 'N/A') AS target_price
              FROM `${project_id}.flight_marts.mart_price_alerts`
              WHERE should_alert = TRUE AND search_name = '$${search_name}'
              LIMIT 1
        result: bq_result

    - emit_alert_if_needed:
        switch:
          - condition: '$${int(default(map.get(bq_result.body, "totalRows"), "0")) > 0}'
            steps:
              - mark_triggered:
                  assign:
                    - row: '$${bq_result.body.rows[0].f}'
                    - price_alert_triggered: true
              - log_price_alert:
                  call: sys.log
                  args:
                    severity: "WARNING"
                    json:
                      event_type: "FLIGHT_PRICE_LOW_ALERT"
                      search_name: $${row[0].v}
                      alert_reason: $${row[1].v}
                      origin: $${row[2].v}
                      destination: $${row[3].v}
                      outbound_date: $${row[4].v}
                      return_date: $${row[5].v}
                      airlines: $${row[6].v}
                      departure_time: $${row[7].v}
                      outbound_duration_mins: $${row[8].v}
                      return_departure_time: $${row[9].v}
                      return_duration_mins: $${row[10].v}
                      trip_type: $${row[11].v}
                      current_price: $${row[12].v}
                      currency: $${row[13].v}
                      previous_min_price: $${row[14].v}
                      target_price: $${row[15].v}

    - return_result:
        return:
          scraper_response: $${scrape_result.body}
          dataform_invocation: $${invocation_result.body.name}
          price_alert_triggered: $${price_alert_triggered}

should_retry_scrape:
  params: [e]
  steps:
    - extract_error_fields:
        assign:
          - error_code: '$${default(map.get(e, "code"), 0)}'
          - error_tags: '$${default(map.get(e, "tags"), [])}'
    - check_retryable:
        switch:
          - condition: '$${error_code in [429, 500, 502, 503, 504]}'
            return: true
          - condition: '$${"ConnectionError" in error_tags or "TimeoutError" in error_tags}'
            return: true
    - do_not_retry:
        return: false

execute_dataform_invocation:
  params: [compilation_result_name, full_refresh]
  steps:
    - invoke_dataform:
        call: http.post
        args:
          url: https://dataform.googleapis.com/v1beta1/projects/${project_id}/locations/${region}/repositories/${dataform_repo_name}/workflowInvocations
          auth:
            type: OAuth2
          body:
            compilationResult: $${compilation_result_name}
            invocationConfig:
              serviceAccount: "${dataform_runner_sa_email}"
              fullyRefreshIncrementalTablesEnabled: $${full_refresh}
        result: invocation_result

    - poll_dataform_status:
        call: http.get
        args:
          url: '$${"https://dataform.googleapis.com/v1beta1/" + invocation_result.body.name}'
          auth:
            type: OAuth2
        result: invocation_status

    - check_dataform_status:
        switch:
          - condition: '$${invocation_status.body.state == "RUNNING"}'
            steps:
              - wait_before_poll:
                  call: sys.sleep
                  args:
                    seconds: 5
              - retry_poll:
                  next: poll_dataform_status
          - condition: '$${invocation_status.body.state != "SUCCEEDED"}'
            steps:
              - build_dataform_error:
                  assign:
                    - dataform_error:
                        message: '$${"Dataform workflow invocation failed with state: " + invocation_status.body.state}'
                        tags: ["DataformInvocationError"]
              - raise_dataform_error:
                  raise: $${dataform_error}

    - return_invocation:
        return: $${invocation_result}

should_retry_dataform:
  params: [e]
  steps:
    - extract_error_fields:
        assign:
          - error_code: '$${default(map.get(e, "code"), 0)}'
          - error_tags: '$${default(map.get(e, "tags"), [])}'
    - check_retryable:
        switch:
          - condition: '$${"DataformInvocationError" in error_tags}'
            return: true
          - condition: '$${error_code in [429, 500, 502, 503, 504]}'
            return: true
          - condition: '$${"ConnectionError" in error_tags or "TimeoutError" in error_tags}'
            return: true
    - do_not_retry:
        return: false
